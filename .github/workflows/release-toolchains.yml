name: Build release toolchains

on:
  push:
    tags:
      - "v*"
      - "go*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-toolchains-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}-amd64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - windows

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install the official Go 1.26 bootstrap toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: Verify bootstrap toolchain
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_version="$(go env GOVERSION)"
          if [[ "$bootstrap_version" != go1.26.* ]]; then
            echo "expected an official Go 1.26 bootstrap toolchain, got $bootstrap_version" >&2
            exit 1
          fi

          echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"
          go version

      - name: Build complete ${{ matrix.goos }}-amd64 toolchain
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          set -euo pipefail
          cd src
          ./make.bash -distpack

      - name: Verify and checksum distribution
        id: distribution
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: amd64
        run: |
          set -euo pipefail

          version="$(head -n 1 VERSION)"
          case "$TARGET_GOOS" in
            linux)
              archive="pkg/distpack/${version}.${TARGET_GOOS}-${TARGET_GOARCH}.tar.gz"
              tar -tzf "$archive" 'go/bin/go' >/dev/null
              tar -tzf "$archive" "go/pkg/tool/${TARGET_GOOS}_${TARGET_GOARCH}/compile" >/dev/null
              ;;
            windows)
              archive="pkg/distpack/${version}.${TARGET_GOOS}-${TARGET_GOARCH}.zip"
              unzip -Z1 "$archive" 'go/bin/go.exe' >/dev/null
              unzip -Z1 "$archive" "go/pkg/tool/${TARGET_GOOS}_${TARGET_GOARCH}/compile.exe" >/dev/null
              ;;
            *)
              echo "unsupported target OS: $TARGET_GOOS" >&2
              exit 1
              ;;
          esac

          archive_dir="$(dirname "$archive")"
          archive_name="$(basename "$archive")"
          (
            cd "$archive_dir"
            sha256sum "$archive_name" > "${archive_name}.sha256"
          )
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.goos }}-amd64 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.distribution.outputs.version }}-${{ matrix.goos }}-amd64
          path: |
            ${{ steps.distribution.outputs.archive }}
            ${{ steps.distribution.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download toolchain artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-amd64"
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(
            find release-assets -maxdepth 1 -type f \
              \( -name '*.linux-amd64.tar.gz' -o -name '*.windows-amd64.zip' \) \
              -print | sort
          )
          if [[ "${#archives[@]}" -ne 2 ]]; then
            echo "expected two toolchain archives, found ${#archives[@]}" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            if [[ ! -f "${archive}.sha256" ]]; then
              echo "missing checksum for $archive" >&2
              exit 1
            fi
            (
              cd "$(dirname "$archive")"
              sha256sum --check "$(basename "$archive").sha256"
            )
          done

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
